name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Validate, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: burguer_house_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Monorepo Dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Run Lint
        run: npm run lint --prefix frontend

      - name: Prisma Validate Schema
        working-directory: backend
        run: npx prisma validate

      - name: Prisma Generate Client
        working-directory: backend
        run: npx prisma generate

      - name: Build Backend
        run: npm run build --prefix backend

      - name: Build Frontend
        run: npm run build --prefix frontend

      - name: Prepare Test Database Schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5433/burguer_house_test?schema=public
        run: npx prisma db push

      - name: Run Tests
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL_TEST: postgresql://test_user:test_password@localhost:5433/burguer_house_test?schema=public
        run: npm test
