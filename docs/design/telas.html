<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burguer House · Esboços das telas</title>
<!--
  Esboços de TODAS as telas do app (mobile, 375 px), aprovados como direção visual para
  as fases F3–F6 do docs/PLANO_FRONTEND.md. Complementa docs/design/referencia-visual.html
  (paleta, Smash, ícones da barra inferior e tela inicial), que continua valendo.
  NÃO é código de produção: dados são fictícios. Abra no navegador.
  Ícones utilitários: Phosphor (aqui pela fonte web; no app, src/components/ui/icons.ts).
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:20px 12px 60px;background:#ECEAE6;color:#151413;font-family:system-ui,sans-serif;font-size:14px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}.hint{color:#6B625A;font-size:13px;margin:0 0 12px;max-width:760px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .chips button,.ctl button{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid #CFC8BE;background:#fff;cursor:pointer}
  .chips button.on{background:#151413;color:#fff;border-color:#151413}
  .ctl{display:flex;gap:8px;margin:6px 0 14px}
  .stage{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
  .notas{flex:1;min-width:260px;max-width:440px;background:#fff;border-radius:16px;padding:14px 16px;font-size:13px;line-height:1.55}
  .notas h3{margin:0 0 6px;font-size:15px}.notas ul{margin:4px 0 0;padding-left:18px}.notas li{margin:3px 0}
  /* ---------- tokens do app (iguais a frontend/src/index.css) ---------- */
  #ph{--cv:#FFF9F3;--cd:#FFFFFF;--c2:#FBF3EA;--fd:#F6EEE5;--ln:#EFE4D8;--ink:#151413;--mu:#6B625A;--fa:#9C958D;--pr:#FF7A1A;--prd:#E85D04;--prs:#FFE8D6;--brd:#B54708;--onp:#151413;--bl:#1D4ED8;--bls:#DCE7FF;--onbl:#fff;--dg:#C0262D;--dgs:#FDE2E2;--ok:#15803D;--oks:#EAF8EE}
  #ph.dark{--cv:#0F0F11;--cd:#1A1A1D;--c2:#222226;--fd:#26262B;--ln:#2E2E34;--ink:#F5F3F0;--mu:#A8A29E;--fa:#78716C;--pr:#FF8A33;--prd:#FF7A1A;--prs:#3A2210;--brd:#FFB077;--onp:#151413;--bl:#7AA7FF;--bls:#16264A;--onbl:#0B1A3A;--dg:#FF7B7B;--dgs:#3B1416;--ok:#4ADE80;--oks:#123322}
  #ph{width:340px;height:740px;border-radius:38px;border:8px solid #151413;background:var(--cv);color:var(--ink);overflow:hidden;position:relative;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;flex-shrink:0}
  #ph *{box-sizing:border-box}
  #tela{flex:1;overflow-y:auto;padding:16px 16px 18px;scrollbar-width:none}#tela::-webkit-scrollbar{display:none}
  .rise{opacity:0;transform:translateY(12px);animation:rise .45s cubic-bezier(.16,1,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
  @keyframes lid{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-16px) rotate(-8deg)}}
  @keyframes popn{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
  @keyframes scan{0%,100%{top:18%}50%{top:78%}}
  .nav{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;cursor:pointer;background:none;border:0;padding:0;min-width:64px;font-family:inherit}
  .nav.on svg{animation:popn .4s cubic-bezier(.34,1.56,.64,1)}
  .tap{transition:transform .15s cubic-bezier(.34,1.56,.64,1);cursor:pointer}.tap:active{transform:scale(.95)}
  .card{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:12px 14px}
  .rot{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600}
  .t1{font-size:20px;font-weight:700;line-height:1.2}
  .t2{font-weight:600}
  .mu{color:var(--mu)}.sm{font-size:12px}.xs{font-size:11px}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:600}
  .btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:16px;font-weight:600;border:0;width:100%;font-family:inherit;font-size:14px}
  .bp{background:var(--pr);color:var(--onp)}.bs{background:var(--bl);color:var(--onbl)}.bok{background:var(--ok);color:#fff}
  #ph.dark .bok{color:#0B2A16}
  .desab{background:var(--fd);color:var(--fa);border:1px dashed var(--ln);cursor:not-allowed}
  .bg{background:var(--cd);color:var(--ink);border:1px solid var(--ln)}
  .campo{display:flex;align-items:center;gap:8px;background:var(--fd);border:1px solid var(--ln);border-radius:14px;padding:0 12px;min-height:46px;color:var(--mu)}
  .campo b{color:var(--ink);font-weight:600}
  .ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--mu);flex-shrink:0}
  .seg{display:flex;background:var(--fd);border-radius:14px;padding:4px;gap:4px}
  .seg span{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:13px;font-weight:600;color:var(--mu)}
  .seg span.on{background:var(--cd);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .barra{height:6px;border-radius:9px;background:var(--c2);overflow:hidden}.barra i{display:block;height:100%;border-radius:9px}
  .l2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;z-index:5}
  .sheet{background:var(--cv);width:100%;max-height:88%;border-radius:26px 26px 0 0;padding:10px 16px 18px;animation:sheet .35s cubic-bezier(.16,1,.3,1);overflow-y:auto}
  .grab{width:40px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 12px}
  .tg{width:42px;height:24px;border-radius:99px;background:var(--pr);position:relative;flex-shrink:0}.tg::after{content:'';position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff}
  .tg.off{background:var(--ln)}.tg.off::after{right:auto;left:3px}
  .row{display:flex;align-items:center;gap:10px}
  .sep{border-top:1px solid var(--ln);margin:10px 0}
</style>
</head>
<body><div class="wrap">
<h1>Burguer House · esboços das telas</h1>
<p class="hint">Direção visual para F3–F6 (375 px). Escolha a tela; as notas ao lado dizem o que muda em relação ao app atual e o que depende de backend ou de decisão. Dados fictícios.</p>
<div class="chips" id="chips"></div>
<div class="ctl"><button id="bTema">Ver escuro</button><button id="bReplay">Repetir animação</button></div>
<div class="stage">
  <div id="ph"><div id="tela"></div><div id="nav"></div><div id="ov"></div></div>
  <div class="notas" id="notas"></div>
</div>
</div>
<script>
/* ---- Smash e ícones da barra inferior: copiados de referencia-visual.html (fonte única do desenho) ---- */
/* ---------- Mascote (SVG 160x160) ---------- */
function mascote(m, size){
  const feliz = m==='happy'||m==='celebrate';
  const eyes = feliz
    ? '<path d="M60 70 q7 -8 14 0 M86 70 q7 -8 14 0" stroke="#151413" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : '<ellipse cx="67" cy="70" rx="5.5" ry="7" fill="#151413"/><ellipse cx="93" cy="70" rx="5.5" ry="7" fill="#151413"/><circle cx="69" cy="67" r="2" fill="#fff"/><circle cx="95" cy="67" r="2" fill="#fff"/>';
  const brows = m==='alert' ? '<path d="M59 58 l14 4 M101 58 l-14 4" stroke="#151413" stroke-width="3.5" stroke-linecap="round"/>' : '';
  const mouth = m==='alert' ? '<path d="M72 86 q8 -6 16 0" stroke="#151413" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : m==='idle'||m==='thinking' ? '<path d="M70 82 q10 9 20 0" stroke="#151413" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : '<path d="M68 80 q12 16 24 0 z" fill="#151413"/><path d="M74 87 q6 4 12 0" fill="#FF6B4A"/>';
  const sweat = m==='alert' ? '<path d="M112 52 q5 9 0 13 q-5 -4 0 -13z" fill="#7AA7FF"/>' : '';
  const think = m==='thinking' ? '<circle cx="128" cy="40" r="4" fill="#B5AEA4"/><circle cx="138" cy="28" r="6" fill="#B5AEA4"/>' : '';
  const conf = m==='celebrate' ? '<rect x="22" y="30" width="7" height="7" fill="#1D4ED8" transform="rotate(20 25 33)"/><rect x="132" y="38" width="7" height="7" fill="#FF7A1A" transform="rotate(-15 135 41)"/><circle cx="34" cy="62" r="3.5" fill="#FF7A1A"/><circle cx="128" cy="20" r="3.5" fill="#1D4ED8"/>' : '';
  const armUp = (x1,dir) => `<path d="M${x1} 108 q${14*dir} -10 ${16*dir} -28" stroke="#151413" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="${x1+16*dir}" cy="78" r="7" fill="#fff" stroke="#151413" stroke-width="3"/>`;
  const armDown = (x1,dir) => `<path d="M${x1} 110 q${12*dir} 6 ${14*dir} 16" stroke="#151413" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="${x1+14*dir}" cy="126" r="7" fill="#fff" stroke="#151413" stroke-width="3"/>`;
  const armR = (m==='wave'||m==='celebrate'||m==='happy') ? armUp(120,1) : armDown(120,1);
  const armL = m==='celebrate' ? armUp(40,-1) : armDown(40,-1);
  const anim = {idle:'bob 2.6s ease-in-out infinite',happy:'hop .9s ease-in-out infinite',thinking:'bob 3.2s ease-in-out infinite',alert:'shake .6s ease-in-out infinite 1s',wave:'bob 1.6s ease-in-out infinite',celebrate:'hop 1.2s ease-out infinite'}[m];
  const lidAnim = m==='celebrate' ? 'animation:lid 1.2s ease-out infinite;transform-box:fill-box;transform-origin:center' : '';
  return `<svg viewBox="0 0 160 160" width="${size}" height="${size}" role="img" aria-label="Mascote, humor ${m}" style="overflow:visible;animation:${anim};flex-shrink:0">
<ellipse cx="80" cy="152" rx="40" ry="5" fill="#151413" opacity="0.12"/>${armL}${armR}
<rect x="36" y="118" width="88" height="20" rx="10" fill="#E9A057"/><rect x="34" y="104" width="92" height="17" rx="8" fill="#5A3220"/>
<path d="M36 104 h88 l-6 9 l-6 -5 l-8 11 l-8 -9 l-10 7 l-8 -8 l-10 10 l-8 -9 l-8 6 l-7 -8 l-9 6z" fill="#FFC531"/>
<path d="M33 101 q8 -8 16 0 q8 -8 16 0 q8 -8 16 0 q8 -8 16 0 q8 -8 16 0 q8 -8 16 0 v5 h-96z" fill="#4CAF50"/>
<g style="${lidAnim}">
<path d="M30 100 q0 -62 50 -62 q50 0 50 62 z" fill="#FF7A1A"/>
<path d="M44 46 q20 -22 52 -14 l4 -12 q-36 -10 -60 14 z" fill="#1D4ED8"/><path d="M96 32 q16 2 24 10" stroke="#1D4ED8" stroke-width="5" stroke-linecap="round" fill="none"/>
<ellipse cx="56" cy="56" rx="3" ry="1.8" fill="#FFF9F3" transform="rotate(-20 56 56)"/><ellipse cx="108" cy="54" rx="3" ry="1.8" fill="#FFF9F3" transform="rotate(25 108 54)"/><ellipse cx="80" cy="50" rx="3" ry="1.8" fill="#FFF9F3"/><ellipse cx="46" cy="78" rx="3" ry="1.8" fill="#FFF9F3"/><ellipse cx="116" cy="80" rx="3" ry="1.8" fill="#FFF9F3"/>
${eyes}${brows}<ellipse cx="56" cy="82" rx="6" ry="3.5" fill="#FF4D2E" opacity="0.45"/><ellipse cx="104" cy="82" rx="6" ry="3.5" fill="#FF4D2E" opacity="0.45"/>${mouth}${sweat}
</g>${conf}${think}</svg>`;
}

/* ---------- Ícones da barra inferior (viewBox 32x32), estilo 1 ---------- */
const CL = {cv:'#FFF9F3',cd:'#FFFFFF',ln:'#EFE4D8',mu:'#8A8178',prs:'#FFE8D6',brd:'#B54708',bl:'#1D4ED8',bun:'#FF7A1A',bun2:'#E9A057',pat:'#5A3220',ch:'#FFC531',let:'#4CAF50',bin:'#151413'};
const CE = {cv:'#0F0F11',cd:'#1A1A1D',ln:'#2E2E34',mu:'#8C8680',prs:'#3A2210',brd:'#FFB077',bl:'#7AA7FF',bun:'#FF8A33',bun2:'#E9A057',pat:'#7A4A30',ch:'#FFC531',let:'#4CAF50',bin:'#3A3A40'};
function iconesNav(c, ativo){
  return [0,1,2,3].map(i => {
    const on = i===ativo, s = on?'#151413':c.mu, sw = on?1.9:1.7, f = x => on?x:'none';
    const svg = inner => `<svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" stroke="${s}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round">${inner}</svg>`;
    if (i===0) return svg(`<path d="M6 15 C6 8.5 10.5 5 16 5 C21.5 5 26 8.5 26 15 Z" fill="${f(c.bun)}"/>
${on?'<ellipse cx="12" cy="9.5" rx="1" ry=".6" fill="#FFF9F3" stroke="none"/><ellipse cx="17" cy="8" rx="1" ry=".6" fill="#FFF9F3" stroke="none"/><ellipse cx="20.5" cy="11" rx="1" ry=".6" fill="#FFF9F3" stroke="none"/>':''}
<path d="M5 18 q2.75 -2.2 5.5 0 t5.5 0 t5.5 0 t5.5 0" fill="none" stroke="${on?c.let:s}"/>
<path d="M5.5 19.5 h21 l-3 3 l-3 -2 l-4 3 l-4 -3 l-3 2 z" fill="${f(c.ch)}" stroke="${on?'#151413':'none'}" stroke-width="1.2"/>
<rect x="5" y="19.5" width="22" height="4" rx="2" fill="${f(c.pat)}"/><rect x="6" y="24.5" width="20" height="3.8" rx="1.9" fill="${f(c.bun2)}"/>`);
    if (i===1) return svg(`<rect x="8" y="3.5" width="16" height="25" rx="3.5" fill="${f(c.bl)}"/><path d="M8 12.5 h16" fill="none"/>
<path d="M11.5 6.5 v3 M11.5 16 v5" stroke="${on?'#FFFFFF':s}" stroke-width="2.2"/>
${on?'<circle cx="19.5" cy="8" r="1.6" fill="#FFC531" stroke="#151413" stroke-width="1"/><rect x="16.5" y="18" width="5" height="3.2" rx="1" fill="#FF7A1A" stroke="#151413" stroke-width="1"/>':''}
<path d="M10 28.5 v1.5 M22 28.5 v1.5" fill="none"/>`);
    if (i===2) return svg(`<path d="M10.5 10 q5.5 -8 11 0" fill="${f(c.bun)}"/>
${on?'<path d="M18.2 4.6 q1.2 1.4 2.6 1.2 q.2 1.6 1.6 2.4" fill="none" stroke="#151413" stroke-width="1.4"/>':''}
<path d="M5.5 11.5 L26 9.2" fill="none" stroke-width="${sw+.3}"/><path d="M13.5 10.6 l-.3 -2.2 l5 -.6 l.3 2.2" fill="none"/>
<path d="M8 13.5 h16 l-1.6 13.3 a2 2 0 0 1 -2 1.7 h-8.8 a2 2 0 0 1 -2 -1.7 Z" fill="${f(c.bin)}"/>
<path d="M13 17 v8 M19 17 v8" fill="none" stroke="${on?'#FFF9F3':s}" stroke-width="1.5"/>`);
    return svg(`<path d="M8 4 h16 v23.5 l-2.7 -2 l-2.6 2 l-2.7 -2 l-2.7 2 l-2.6 -2 l-2.7 2 Z" fill="${f('#FFFFFF')}"/>
<path d="M11 8 h10" fill="none" stroke="${on?'#151413':s}" stroke-width="1.5"/>
<rect x="11" y="16.5" width="2.6" height="5.5" rx=".8" fill="${f(c.bl)}" stroke-width="1.2"/>
<rect x="14.7" y="13" width="2.6" height="9" rx=".8" fill="${f(c.bun)}" stroke-width="1.2"/>
<rect x="18.4" y="10.5" width="2.6" height="11.5" rx=".8" fill="${f(c.bun)}" stroke-width="1.2"/>`);
  });
}
const ABAS = ['Início','Estoque','Perdas','Relatórios'];
function barra(c, ativo, onClick){
  const ic = iconesNav(c, ativo);
  return `<div style="display:flex;justify-content:space-around;padding:10px 6px 12px">${ABAS.map((l,i) => {
    const on = i===ativo;
    return `<button class="nav ${on?'on':''}" data-i="${i}" data-alvo="${onClick}" style="color:${on?c.brd:c.mu};font-weight:${on?600:400}"><span style="border-radius:999px;padding:4px 14px;background:${on?c.prs:'transparent'}">${ic[i]}</span>${l}</button>`;
  }).join('')}</div>`;
}

let escuro = false, atual = 'inicio';
const d = i => `data-d="${i}"`; /* atraso aplicado depois do render: dois atributos style no mesmo elemento anulam o segundo */
const ic = (n, peso='bold', tam=18, cor='currentColor') => `<i class="ph-${peso} ph-${n}" style="font-size:${tam}px;color:${cor}" aria-hidden="true"></i>`;
const topo = (titulo, {rotulo='', voltar=false, acoes=''} = {}) => `
<div class="rise row" ${d(0)} style="align-items:flex-start;margin-bottom:12px">
  ${voltar ? `<span class="ib tap" style="margin-left:-10px">${ic('arrow-left','bold',22,'var(--ink)')}</span>` : ''}
  <div style="flex:1;min-width:0">${rotulo ? `<div class="rot">${rotulo}</div>` : ''}<div class="t1 l2">${titulo}</div></div>${acoes}</div>`;
const avatar = `<span style="width:38px;height:38px;border-radius:50%;background:var(--prs);color:var(--brd);display:grid;place-items:center;font-weight:700">C</span>`;

const TELAS = {
/* ------------------------------------------------------------------ LOGIN */
login: { nome:'Login', aba:null, html: () => `
<div style="display:flex;flex-direction:column;min-height:100%;justify-content:center;padding-top:20px">
  <div class="rise" ${d(0)} style="display:flex;justify-content:center">${mascote('wave',130)}</div>
  <div class="rise" ${d(1)} style="text-align:center;margin:8px 0 22px"><div style="font-size:26px;font-weight:800;letter-spacing:-.02em">Burguer <span style="color:var(--pr)">House</span></div><div class="mu sm">Estoque da cozinha, sem planilha.</div></div>
  <div class="rise" ${d(2)} style="display:flex;flex-direction:column;gap:10px">
    <label class="xs mu" style="font-weight:600">E-mail</label><div class="campo">${ic('envelope-simple')}<b>carlos@burguerhouse.com.br</b></div>
    <label class="xs mu" style="font-weight:600;margin-top:4px">Senha</label><div class="campo">${ic('lock-key')}<b style="letter-spacing:.2em">••••••••</b><span style="margin-left:auto">${ic('eye')}</span></div>
    <button class="btn bp tap" style="margin-top:10px">Entrar ${ic('arrow-right')}</button>
  </div>
  <div class="rise mu xs" ${d(3)} style="text-align:center;margin-top:18px">Problemas para entrar? Fale com o gerente.</div>
</div>`,
  notas: `<h3>Login</h3><ul>
<li>Smash acenando (<code>wave</code>) e marca no topo; um único botão principal.</li>
<li>Mostrar/ocultar senha no ícone de olho.</li>
<li>Erro de credencial: mensagem abaixo do campo de senha + Smash <code>alert</code>.</li>
<li>O atalho "Ambiente de teste: preencher credenciais" continua só em <code>import.meta.env.DEV</code> e não aparece aqui.</li>
<li>Não há "esqueci a senha" no backend: o texto orienta a falar com o gerente.</li></ul>` },

/* ------------------------------------------------------------------ INÍCIO */
inicio: { nome:'Início', aba:0, html: () => `
<div class="rise row" ${d(0)} style="justify-content:space-between"><div><div class="xs mu row" style="gap:4px">${ic('calendar-blank','bold',13)}Segunda, 10 de novembro</div><div class="t1">Boa noite, Carlos</div></div>
  <div class="row" style="gap:8px"><span class="ib tap" style="width:38px;height:38px;border:1px solid var(--ln);border-radius:50%">${ic('gear-six')}</span>${avatar}</div></div>
<div class="rise row" ${d(1)} style="gap:6px;margin-top:10px">${mascote('alert',74)}<div class="card sm" style="border-radius:16px;padding:10px 12px">3 insumos pedem atenção antes do jantar.</div></div>
<div class="rise" ${d(2)} style="background:var(--ink);color:var(--cv);border-radius:24px;padding:16px;margin-top:10px">
  <div class="row xs" style="justify-content:space-between;opacity:.8"><span class="row" style="gap:4px">${ic('receipt','bold',14)}Vendas hoje</span><span class="row" style="gap:4px">${ic('hamburger','bold',14)}48 pedidos</span></div>
  <div style="font-size:30px;font-weight:700;margin:2px 0 10px">R$ 1.284,50</div>

const ORDEM = ['login','inicio','estoque','insumoForm','produtos','ficha','fichaAdd','preparo','perdas','relatorios','nf1','nf2','nf3','perfil','config'];
function render(){
  const t = TELAS[atual], base = t.base ? TELAS[t.base] : t;
  const ph = document.getElementById('ph'); ph.classList.toggle('dark', escuro);
  document.getElementById('tela').innerHTML = base.html();
  document.getElementById('tela').scrollTop = 0;
  const aba = t.aba;
  document.getElementById('nav').innerHTML = aba === null ? '' : `<div style="background:var(--cd);border-top:1px solid var(--ln)">${barra(escuro?CE:CL, aba, 'x')}</div>`;
  document.getElementById('ov').innerHTML = t.sheet ? `<div class="sheetbg"><div class="sheet"><div class="grab"></div>${t.sheet()}</div></div>` : '';
  document.querySelectorAll('[data-d]').forEach(e => e.style.animationDelay = (+e.dataset.d * 60) + 'ms');
  document.getElementById('notas').innerHTML = t.notas;
  document.getElementById('bTema').textContent = escuro ? 'Ver claro' : 'Ver escuro';
  document.querySelectorAll('#chips button').forEach(b => b.classList.toggle('on', b.dataset.t === atual));
}
document.getElementById('chips').innerHTML = ORDEM.map(k => `<button data-t="${k}">${TELAS[k].nome}</button>`).join('');
document.querySelectorAll('#chips button').forEach(b => b.onclick = () => { atual = b.dataset.t; render(); });
document.getElementById('bTema').onclick = () => { escuro = !escuro; render(); };
document.getElementById('bReplay').onclick = render;
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('.nav'); if (!b) return;
  atual = ['inicio','estoque','perdas','relatorios'][+b.dataset.i]; render();
});
/* Abrir direto numa tela: telas.html#perdas ou telas.html#perdas:escuro */
const [hTela, hTema] = decodeURIComponent(location.hash.slice(1)).split(':');
if (TELAS[hTela]) atual = hTela;
if (hTema === 'escuro') escuro = true;
render();
</script>
